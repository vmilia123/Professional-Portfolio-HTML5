<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Unique page title -->
    <title>Ester Vmilia | Contact</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Contact Me</h1>
        <p>Get in touch with me</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="gallery.html">Gallery</a>
        <a href="data.html">Skills</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Main content -->
    <main>

        <section>
            <h2>Send Me a Message</h2>

            <p>
                If you would like to contact me, complete the form below.
            </p>

            <!-- Contact form -->
            <form action="#" method="post">

                <!-- Name -->
                <p>
                    <label for="name">Full Name:</label>
                    <input type="text"
                           id="name"
                           name="name"
                           required>
                </p>

                <!-- Email -->
                <p>
                    <label for="email">Email Address:</label>
                    <input type="email"
                           id="email"
                           name="email"
                           required>
                </p>

                <!-- Phone -->
                <p>
                    <label for="phone">Phone Number:</label>
                    <input type="tel"
                           id="phone"
                           name="phone">
                </p>

                <!-- Message -->
                <p>
                    <label for="message">Message:</label>
                    <textarea id="message"
                              name="message"
                              rows="7"
                              required></textarea>
                </p>

                <!-- Submit button -->
                <p>
                    <button type="submit">Send Message</button>
                </p>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Ester Vmilia. All Rights Reserved.</p>
    </footer>

</body>
</html>
